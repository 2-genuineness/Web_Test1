<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭐ 스타 캐처 : 확장형 에디션 ⭐</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1b1b3a 0%, #0b0b1a 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: width 0.5s ease;
        }
        canvas {
            background: #0f0f23;
            display: block;
        }
        .ui-panel {
            margin-top: 15px;
            text-align: center;
            font-size: 15px;
            color: #aaa;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .btn-ctrl {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-ctrl:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="game-container" id="container">
        <canvas id="gameCanvas" width="450" height="600"></canvas>
    </div>
    
    <div class="ui-panel">
        <div>조작법: 스페이스바(시작) / 키보드 좌우 방향키 (←, →) 또는 버튼</div>
        <div class="controls">
            <button class="btn-ctrl" id="leftBtn">◀ 왼쪽</button>
            <button class="btn-ctrl" id="rightBtn">오른쪽 ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("container");

        // 게임 상태 변수
        let score = 0;
        let lives = 3;
        let round = 1;
        let highScore = localStorage.getItem("starGameHighScoreV3") || 0;
        let gameState = "START"; // START, ROUND_TRANSITION, PLAYING, GAMEOVER
        let transitionTimer = 0;

        // 바구니 설정 (현재 캔버스 크기에 맞춰 동적 조절)
        let catcher = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 60,
            width: 100,
            height: 20,
            speed: 7,
            dx: 0
        };

        let stars = [];
        let particles = [];

        // 맵 크기 확장 함수 (라운드별 캔버스 너비 조절)
        function updateCanvasWidth() {
            // 라운드가 오를수록 가로 폭이 50씩 넓어짐 (기본 450 -> 최대 제한 등)
            let newWidth = Math.min(450 + (round - 1) * 60, 750);
            canvas.width = newWidth;
            container.style.width = newWidth + "px";
            
            // 바구니가 화면 밖으로 나가지 않도록 조정
            if (catcher.x + catcher.width > canvas.width) {
                catcher.x = canvas.width - catcher.width;
            }
        }

        // 키보드 이벤트
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") catcher.dx = -catcher.speed;
            if (e.key === "ArrowRight") catcher.dx = catcher.speed;
            if (e.key === " " && (gameState === "START" || gameState === "GAMEOVER")) {
                e.preventDefault();
                startGame();
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") catcher.dx = 0;
        });

        // 모바일/마우스 버튼 조작
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");

        leftBtn.addEventListener("mousedown", () => catcher.dx = -catcher.speed);
        leftBtn.addEventListener("mouseup", () => catcher.dx = 0);
        rightBtn.addEventListener("mousedown", () => catcher.dx = catcher.speed);
        rightBtn.addEventListener("mouseup", () => catcher.dx = 0);

        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); catcher.dx = -catcher.speed; });
        leftBtn.addEventListener("touchend", (e) => { e.preventDefault(); catcher.dx = 0; });
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); catcher.dx = catcher.speed; });
        rightBtn.addEventListener("touchend", (e) => { e.preventDefault(); catcher.dx = 0; });

        function startGame() {
            score = 0;
            lives = 3;
            round = 1;
            stars = [];
            particles = [];
            updateCanvasWidth();
            catcher.x = canvas.width / 2 - catcher.width / 2;
            gameState = "PLAYING";
        }

        function startNextRound() {
            round++;
            stars = [];
            updateCanvasWidth(); // 라운드 오를 때 맵 확장!
            gameState = "ROUND_TRANSITION";
            transitionTimer = 100; // 약 1.6초 대기
        }

        function spawnStar() {
            // 라운드가 오를수록 동시에 떨어지는 개수 증가 (기본 1개 ~ 최대 4개까지)
            let maxStarsPerSpawn = Math.min(1 + Math.floor((round - 1) / 2), 4);
            
            // 천천히 여유있게 떨어지도록 확률 조절
            let spawnRate = 0.02 + (round * 0.003);
            
            if (Math.random() < spawnRate && gameState === "PLAYING" && stars.length < maxStarsPerSpawn + 2) {
                for (let i = 0; i < maxStarsPerSpawn; i++) {
                    const types = ['normal', 'normal', 'normal', 'heart'];
                    const type = types[Math.floor(Math.random() * types.length)];
                    
                    // 난이도 완화를 위해 초기 속도를 낮고 부드럽게 설정
                    let baseSpeed = 2.0 + (round * 0.25);

                    stars.push({
                        x: Math.random() * (canvas.width - 40) + 20,
                        y: -20 - (i * 25), // 동시 생성될 때 살짝 위아래 간격 두기
                        radius: type === 'heart' ? 14 : 12,
                        speed: type === 'heart' ? baseSpeed * 0.7 : baseSpeed,
                        type: type
                    });
                }
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    alpha: 1,
                    color: color
                });
            }
        }

        function update() {
            if (gameState === "ROUND_TRANSITION") {
                transitionTimer--;
                if (transitionTimer <= 0) {
                    gameState = "PLAYING";
                }
                return;
            }

            if (gameState !== "PLAYING") return;

            // 20점마다 라운드 클리어 및 다음 단계 전환
            if (score >= round * 20) {
                startNextRound();
                return;
            }

            // 바구니 이동 (확장된 맵 크기 적용)
            catcher.x += catcher.dx;
            if (catcher.x < 0) catcher.x = 0;
            if (catcher.x + catcher.width > canvas.width) {
                catcher.x = canvas.width - catcher.width;
            }

            spawnStar();

            // 별 업데이트
            for (let i = stars.length - 1; i >= 0; i--) {
                let s = stars[i];
                s.y += s.speed;

                // 충돌 체크
                if (
                    s.y + s.radius >= catcher.y &&
                    s.y - s.radius <= catcher.y + catcher.height &&
                    s.x >= catcher.x &&
                    s.x <= catcher.x + catcher.width
                ) {
                    if (s.type === 'heart') {
                        lives = Math.min(lives + 1, 5); // 최대 하트 5개
                        createParticles(s.x, s.y, '#ff4757');
                    } else {
                        score += 1;
                        createParticles(s.x, s.y, '#ffd700');
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem("starGameHighScoreV3", highScore);
                        }
                    }
                    stars.splice(i, 1);
                    continue;
                }

                // 바닥에 떨어졌을 때 (하트는 그냥 사라짐, 별은 목숨 감소)
                if (s.y > canvas.height) {
                    if (s.type !== 'heart') {
                        lives--;
                        if (lives <= 0) {
                            gameState = "GAMEOVER";
                        }
                    }
                    stars.splice(i, 1);
                }
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawStarShape(x, y, radius, color) {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = color;
            let rot = Math.PI / 2 * 3;
            let cx = x, cy = y;
            let steps = 5;
            let step = Math.PI / steps;

            ctx.moveTo(cx, cy - radius);
            for (let i = 0; i < steps; i++) {
                cx = x + Math.cos(rot) * radius;
                cy = y + Math.sin(rot) * radius;
                ctx.lineTo(cx, cy);
                rot += step;

                cx = x + Math.cos(rot) * (radius / 2);
                cy = y + Math.sin(rot) * (radius / 2);
                ctx.lineTo(cx, cy);
                rot += step;
            }
            ctx.lineTo(x, y - radius);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 반짝임
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            ctx.fillRect(60, 50, 2, 2);
            ctx.fillRect(200, 180, 3, 3);
            ctx.fillRect(canvas.width - 100, 120, 2, 2);

            if (gameState === "START") {
                ctx.fillStyle = "#fff";
                ctx.font = "bold 26px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("🌟 스타 캐처 : 확장판 🌟", canvas.width / 2, canvas.height / 2 - 50);
                
                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#aaa";
                ctx.fillText("20점마다 라운드 상승! 맵이 넓어지고 별이 늘어납니다.", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = "#ffdd59";
                ctx.fillText("[ 스페이스바 ]를 눌러 시작하세요!", canvas.width / 2, canvas.height / 2 + 35);
                ctx.textAlign = "left";
                return;
            }

            if (gameState === "ROUND_TRANSITION") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffdd59";
                ctx.font = "bold 28px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText(`🚀 ROUND ${round} 진입! 🚀`, canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = "14px 'Segoe UI'";
                ctx.fillStyle = "#ccc";
                ctx.fillText("맵이 확장되고 떨어지는 별 개수가 증가합니다!", canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = "left";
                return;
            }

            // 파티클
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.restore();
            }

            // 바구니
            let grad = ctx.createLinearGradient(catcher.x, catcher.y, catcher.x, catcher.y + catcher.height);
            grad.addColorStop(0, "#4cd137");
            grad.addColorStop(1, "#44bd32");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(catcher.x, catcher.y, catcher.width, catcher.height, 6);
            ctx.fill();

            // 아이템
            for (let s of stars) {
                if (s.type === 'heart') {
                    ctx.fillStyle = "#ff4757";
                    ctx.font = "20px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText("❤️", s.x, s.y + 6);
                } else {
                    drawStarShape(s.x, s.y, s.radius, "#ffdd59");
                }
            }

            // UI 정보
            ctx.fillStyle = "#fff";
            ctx.font = "bold 14px 'Segoe UI'";
            ctx.textAlign = "left";
            ctx.fillText(`점수: ${score} / ${round * 20}`, 15, 25);
            ctx.fillText(`라운드: ${round} (동시 ${Math.min(1 + Math.floor((round - 1) / 2), 4)}개)`, 15, 48);
            ctx.fillText(`최고기록: ${highScore}`, 15, 71);

            ctx.textAlign = "right";
            ctx.fillText(`생명: ${'❤️'.repeat(lives)}`, canvas.width - 15, 25);

            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.font = "bold 28px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("게임 오버", canvas.width / 2, canvas.height / 2 - 40);

                ctx.font = "15px 'Segoe UI'";
                ctx.fillStyle = "#ccc";
                ctx.fillText(`도달 라운드: ${round}단계`, canvas.width / 2, canvas.height / 2 - 5);
                ctx.fillText(`최종 점수: ${score}점`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillStyle = "#ffdd59";
                ctx.fillText("스페이스바를 눌러 다시 도전하세요!", canvas.width / 2, canvas.height / 2 + 55);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
